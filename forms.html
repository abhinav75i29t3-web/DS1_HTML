<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <fieldset>
        <form action="#" name="" target="_self" method="get">
            <label for="name">UserName:</label>
            &nbsp; &nbsp;
            <input type="text" name="name" id="name" placeholder="Enter your Name" required>

            <br><br>

            <label for="password">Password:</label>
            &nbsp; &nbsp; &nbsp;
            <input type="password" name="password" id="password" placeholder="Enter your Password" required>

            <br><br>

            <label for="email">Email:</label>
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            <input type="email" name="email" id="email" placeholder="Enter your Email">

            <br><br>

            
            <label for="gender">Gender:</label>
            &nbsp; &nbsp; &nbsp; &nbsp;
            <input type="radio" name="gender" id="gender">
            <label for="gender">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female</label>
            
            <br><br>

            <label for="hobbies">Hobbies</label>
            &nbsp; &nbsp; &nbsp; &nbsp;
            <input type="checkbox" name="hobbie1" id="hobbie1">
            <label for="hobbie1">Cricket</label>
            <input type="checkbox" name="hobbie2" id="hobbie2">
            <label for="hobbie2">Football</label>

            <br><br>

            <label for="DOB">DOB:</label>
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            <input type="date" name="DOB" id="DOB">

            <br><br>

            <label for="lang">Programming Languages:</label>
            &nbsp;
            <select name="lang" id="lang">
                <option value="">Select Language</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="JAVA">JAVA</option>
                <option value="Python">Python</option>

            </select>
        </form>
    </fieldset>
</body>
</html>
