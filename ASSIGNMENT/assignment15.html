<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 15</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label for="name">Name:</label>
            <input type="text" id="name"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email"><br><br>

            <label for="pwd">Password:</label>
            <input type="password" id="pwd"><br><br>

            Gender:
            <input type="radio" id="male" name="gender"><label for="male">Male</label>
            <input type="radio" id="female" name="gender"><label for="female">Female</label><br><br>

            Hobbies:
            <input type="checkbox" id="read"><label for="read">Reading</label>
            <input type="checkbox" id="code"><label for="code">Coding</label><br><br>

            <label for="dob">DOB:</label>
            <input type="text" id="dob">
        </fieldset>
    </form>
</body>
</html>
