<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 18</title>
    <style>
        body { margin: 0; font-family: Georgia, serif; }
        header, footer { background-color: #1a237e; color: white; text-align: center; padding: 15px; }
        main { width: 80%; margin: 20px auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #888; padding: 8px; text-align: left; }
        th { background-color: #e8eaf6; text-align: center; }
        fieldset { padding: 15px; }
        input[type="text"], input[type="email"], textarea { width: 300px; max-width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="submit.php" method="POST">
            <fieldset>
                <legend>Application Form</legend>
                <label for="sname">Name:</label><br>
                <input type="text" id="sname" required><br><br>

                <label for="semail">Email:</label><br>
                <input type="email" id="semail" required><br><br>

                <label for="scourse">Course:</label><br>
                <select id="scourse">
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select><br><br>

                <label for="stmt">Statement:</label><br>
                <textarea id="stmt" rows="4" required></textarea><br><br>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>
</body>
</html>
